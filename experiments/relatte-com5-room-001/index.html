<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>reLATTE × COM⁵ × ROroomOM</title>
<style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee}
header{padding:1rem 1.25rem;border-bottom:1px solid #555}
.shell{display:grid;grid-template-columns:minmax(260px,34%) 1fr;min-height:calc(100vh - 74px)}
nav,main{padding:1rem;overflow:auto}
nav{border-right:1px solid #555}
.panel{border:1px solid #666;padding:.8rem;margin-bottom:.8rem}
.block{border:2px solid #aaa;padding:.85rem;margin:.5rem 0;overflow-wrap:anywhere}
.doors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4rem}
button,input{font:inherit}
button{padding:.55rem .6rem;cursor:pointer}
.door.active{outline:2px solid currentColor}
.lego{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.65rem}
.instrument{border:1px solid #888;padding:.75rem;min-height:140px;overflow-wrap:anywhere}
.instrument button{margin-top:.5rem}
.fog{opacity:.65}
.good{font-weight:700}
.log{white-space:pre-wrap;max-height:220px;overflow:auto}
@media(max-width:850px){.shell{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid #555}.doors{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <strong>reLATTE × COM⁵ × ROroomOM</strong>
  <span class="fog"> · Particulars are navigable. Doors are projective. Rooms are inhabitable.</span>
</header>
<div class="shell">
<nav>
  <div class="panel">
    <button id="sample">Load specimen</button>
    <input id="file" type="file" accept="application/json">
  </div>
  <div class="panel">
    <strong>NAVIGATOR</strong>
    <div id="block" class="block fog">No particular loaded.</div>
  </div>
  <div class="panel">
    <strong>COM⁵ DOORS</strong>
    <div id="doors" class="doors"></div>
  </div>
  <div class="panel">
    <strong>NEIGHBORS</strong>
    <div id="neighbors" class="fog">(none loaded)</div>
  </div>
</nav>
<main>
  <div class="panel">
    <strong>ROroomOM LOCAL ENCOUNTER</strong>
    <div id="encounter" class="fog">Choose a door.</div>
  </div>
  <div id="deck" class="lego"></div>
  <div class="panel">
    <button id="leave" disabled>Leave</button>
    <button id="return" disabled>Return</button>
    <button id="receipt" disabled>Export local receipt</button>
  </div>
  <div class="panel">
    <strong>LOCAL TRACE</strong>
    <div id="log" class="log fog">(no local actions)</div>
  </div>
</main>
</div>
<script type="module">
import {actEncounter,enterDoor,exportEncounterReceipt,openNavigator,useInstrument} from './room.mjs';

let navigatorState=null;
let room=null;

const q=id=>document.querySelector(id);
const block=q('#block'), doors=q('#doors'), neighbors=q('#neighbors'), encounter=q('#encounter'), deck=q('#deck'), log=q('#log');
const esc=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');

function renderNavigator(){
  doors.innerHTML='';
  if(!navigatorState?.ok){
    block.textContent='No particular loaded.';
    neighbors.textContent='(none loaded)';
    return;
  }
  block.className='block';
  block.innerHTML='<strong>'+esc(navigatorState.sourceSubject)+'</strong><br><span class="fog">held projection · authority: none</span>';
  neighbors.textContent=navigatorState.neighbors.length?navigatorState.neighbors.join('\n'):'(none in this projection)';

  for(const door of navigatorState.doors){
    const button=document.createElement('button');
    button.className='door';
    button.textContent=door.role+'\n'+door.instrumentCount+' block'+(door.instrumentCount===1?'':'s');
    button.onclick=()=>{
      const next=enterDoor(navigatorState,door.role,true);
      if(!next.ok){alert(next.explanation);return;}
      room=next;
      renderRoom();
    };
    doors.append(button);
  }
}

function renderRoom(){
  deck.innerHTML='';
  if(!room?.ok){
    encounter.textContent='Choose a door.';
    return;
  }
  encounter.className='';
  encounter.innerHTML='<strong>'+esc(room.sourceDoor)+'</strong> · '+esc(room.encounterId)+'<br><span class="fog">same source: '+esc(room.sourceSubject)+' · source mutated: no</span>';

  for(const item of room.instrumentDeck){
    const card=document.createElement('section');
    card.className='instrument';
    card.innerHTML='<strong>'+esc(item.label)+'</strong><br><span class="fog">'+esc(item.kind)+(item.mediaType?' · '+esc(item.mediaType):'')+'</span><br><small>'+esc(item.sourceRef ?? 'receiver-local structural instrument')+'</small>';
    const use=document.createElement('button');
    use.textContent='Use locally';
    use.onclick=()=>{
      const next=useInstrument(room,item.localInstrumentId);
      if(!next.ok){alert(next.explanation);return;}
      room=next;renderRoom();
    };
    card.append(use);
    deck.append(card);
  }

  q('#leave').disabled=room.phase==='away';
  q('#return').disabled=room.phase!=='away';
  q('#receipt').disabled=false;
  log.className='log';
  log.textContent=room.localHistory.map((item,index)=>String(index+1).padStart(2,'0')+'  '+JSON.stringify(item)).join('\n');
}

q('#sample').onclick=async()=>{
  const response=await fetch('./fixture-enterable-song.json');
  navigatorState=openNavigator(await response.json());
  room=null;renderNavigator();renderRoom();
};
q('#file').onchange=async event=>{
  const file=event.target.files?.[0];
  if(!file)return;
  navigatorState=openNavigator(await file.text());
  if(!navigatorState.ok){alert(navigatorState.explanation);return;}
  room=null;renderNavigator();renderRoom();
};
q('#leave').onclick=()=>{const next=actEncounter(room,'LEAVE');if(next.ok){room=next;renderRoom();}};
q('#return').onclick=()=>{const next=actEncounter(room,'RETURN');if(next.ok){room=next;renderRoom();}};
q('#receipt').onclick=()=>{
  const data=JSON.stringify(exportEncounterReceipt(room),null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='roroomom-relatte-com5-local-receipt.json';
  a.click();
  URL.revokeObjectURL(a.href);
};

renderNavigator();renderRoom();
</script>
</body>
</html>
